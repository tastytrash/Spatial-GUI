pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Stonecutter'
            url = "https://maven.kikugie.dev"
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.9.8"
}

stonecutter {
    create(rootProject) {
        vers("26.2-fabric", "26.2")
        vers("26.2-neoforge", "26.2")
        vers("26.3-fabric", "26.3")
        vers("26.3-neoforge", "26.3")
    }
}