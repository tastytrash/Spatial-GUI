name: Suggestion
description: Ideas for new features or improvements
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! 
        Before posting, please check existing issues to make sure it hasn't been suggested already.

  - type: textarea
    id: description
    attributes:
      label: Describe your suggestion
      description: What would you like added, and why?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Is there something you currently can't do, or that you think would be helpful to have?
      placeholder: Optional, but helps evaluate the suggestion
    validations:
      required: false